id: shop-tracing
prompt: |
  We cannot follow one request through the shop. Add a trace id:
  create_user and create_order take an optional trace_id (make one up
  when none is given). Every log record written while handling that
  request, in any service, and every event published because of it, must
  carry the same trace id - as trace_id in log records, and as
  headers["trace_id"] in events.

  Request: https://github.com/acme-shop/shop/issues/47 (from Priya Shah)
# The request the prompt's last line links. Both arms see the same line;
# the harness's fake GitHub answers for this issue, and the pull request
# is number + 1. tools/check_scenarios.py checks the two agree.
request:
  repo: acme-shop/shop
  number: 47
  requester: Priya Shah
  title: Follow one request through the shop with a trace id
budget_usd: 3.0
hidden_command: python3 -m pytest tests/test_hidden_tracing.py -q
continue_reply: Go ahead with whichever option you recommend.
expected_route: regular
